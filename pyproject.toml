[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsaclausula"
version = "0.1.0"
description = "Conciliación de bolsas de días de contratación estatutaria (N91c / S9b1a) entre PeopleNet y Propuestas"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bolsa = "bolsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
